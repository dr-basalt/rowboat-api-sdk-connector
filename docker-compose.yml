version: '3.8'

services:
  rowboat-connector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rowboat-api-connector
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Server Configuration
      - PORT=8000
      - HOST=0.0.0.0
      - DEBUG=${DEBUG:-false}

      # OpenWebUI Integration
      - ENABLE_OWUI=${ENABLE_OWUI:-true}

      # Note: Rowboat credentials are NOT configured here.
      # They are provided per-request, allowing multi-project usage.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - rowboat-network

networks:
  rowboat-network:
    driver: bridge
